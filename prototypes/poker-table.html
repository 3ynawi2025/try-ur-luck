<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>جرب حظك — Prototype طاولة بوكر</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #D4AF37;
      --gold-light: #F4D03F;
      --gold-dark: #B5902A;
      --bg: #0A0F14;
      --surface: rgba(19, 46, 53, 0.85);
      --table-green: #1B5E20;
      --table-light: #2E7D32;
      --table-dark: #0D3B10;
      --danger: #C62828;
      --info: #1565C0;
      --text: #FFFFFF;
      --muted: #B0BEC5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 100%;
      max-width: 414px;
      height: 100%;
      position: relative;
      background: radial-gradient(circle at 50% 40%, var(--table-light) 0%, var(--table-green) 40%, var(--table-dark) 100%);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 48px 16px 12px;
      background: linear-gradient(to bottom, rgba(10,15,20,0.95), rgba(10,15,20,0.4));
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .header-center { text-align: center; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header span { font-size: 12px; color: var(--gold); }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid rgba(212,175,55,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--gold);
    }

    /* Table area */
    .table-area {
      flex: 1;
      position: relative;
      margin: 90px 12px 140px;
    }

    .table-oval {
      position: absolute;
      top: 10%;
      left: 4%;
      right: 4%;
      bottom: 18%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(67,160,71,0.9) 0%, rgba(27,94,32,0.95) 60%, rgba(13,59,16,1) 100%);
      border: 4px solid rgba(212,175,55,0.5);
      box-shadow:
        inset 0 0 60px rgba(0,0,0,0.6),
        0 10px 40px rgba(0,0,0,0.5),
        0 0 30px rgba(212,175,55,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    /* Community cards */
    .community {
      display: flex;
      gap: 6px;
    }
    .card {
      width: 44px; height: 62px;
      background: white;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative;
      color: #C62828;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
    }
    .card.black { color: #212121; }
    .card .rank { font-size: 14px; position: absolute; top: 4px; left: 5px; }
    .card .rank-br { font-size: 14px; position: absolute; bottom: 4px; right: 5px; transform: rotate(180deg); }
    .card .suit { font-size: 22px; opacity: 0.35; }

    /* Pot */
    .pot {
      display: flex; flex-direction: column; align-items: center;
      background: rgba(10,15,20,0.6);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(212,175,55,0.2);
    }
    .pot-label { font-size: 10px; color: var(--muted); }
    .pot-row { display: flex; align-items: center; gap: 6px; }
    .pot-amount { font-family: 'Inter'; font-size: 22px; color: var(--gold); }

    /* Seats */
    .seat {
      position: absolute;
      display: flex; flex-direction: column; align-items: center;
      background: rgba(10,15,20,0.8);
      padding: 6px 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      min-width: 72px;
      gap: 2px;
    }
    .seat.active { border-color: var(--gold); box-shadow: 0 0 15px rgba(212,175,55,0.3); z-index: 10; }
    .avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #0A0F14; font-size: 14px;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .seat.active .avatar { box-shadow: 0 0 12px var(--gold); }
    .seat-name { font-size: 10px; font-weight: 700; }
    .seat-balance { font-family: 'Inter'; font-size: 10px; color: var(--gold); }
    .seat-cards {
      display: flex; gap: 2px;
      position: absolute;
      bottom: -16px;
    }
    .seat-card { width: 22px; height: 30px; background: white; border-radius: 3px; }
    .seat-bet {
      position: absolute;
      top: -14px;
      display: flex; align-items: center; justify-content: center;
    }
    .chip {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: #C62828;
      border: 2px dashed rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; font-family: 'Inter'; font-weight: 700;
    }

    /* Position seats */
    .s1 { bottom: -8%; left: 50%; transform: translateX(-50%); }
    .s2 { bottom: 18%; right: -2%; }
    .s3 { top: 18%; right: -2%; }
    .s4 { top: -6%; left: 50%; transform: translateX(-50%); }
    .s5 { top: 18%; left: -2%; }
    .s6 { bottom: 18%; left: -2%; }

    /* Action bar */
    .action-bar {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      background: rgba(10,15,20,0.95);
      border-top: 1px solid rgba(212,175,55,0.3);
      padding: 14px 16px 28px;
      display: flex; gap: 10px;
      z-index: 20;
    }
    .btn {
      flex: 1;
      height: 50px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
      border: none;
      color: white;
    }
    .btn-fold { background: var(--danger); }
    .btn-call { background: var(--info); }
    .btn-raise {
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
      color: #0A0F14;
      box-shadow: 0 4px 16px rgba(212,175,55,0.35);
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="icon-btn">⬅️</div>
      <div class="header-center">
        <h1>طاولة الرياض</h1>
        <span>Pre-flop</span>
      </div>
      <div class="icon-btn">🔇</div>
    </div>

    <div class="table-area">
      <div class="table-oval">
        <div class="community">
          <div class="card black"><span class="rank">A</span><span class="suit">♠</span><span class="rank-br">A</span></div>
          <div class="card black"><span class="rank">K</span><span class="suit">♠</span><span class="rank-br">K</span></div>
          <div class="card"><span class="rank">Q</span><span class="suit">♥</span><span class="rank-br">Q</span></div>
          <div class="card"><span class="rank">J</span><span class="suit">♦</span><span class="rank-br">J</span></div>
          <div class="card black"><span class="rank">10</span><span class="suit">♣</span><span class="rank-br">10</span></div>
        </div>
        <div class="pot">
          <div class="pot-label">الرهان</div>
          <div class="pot-row">
            <div class="chip">1K</div>
            <div class="pot-amount">1,240</div>
          </div>
        </div>
      </div>

      <div class="seat s1 active">
        <div class="avatar">أ</div>
        <div class="seat-name">أنت</div>
        <div class="seat-balance">4,980</div>
        <div class="seat-cards">
          <div class="seat-card" style="background:linear-gradient(135deg,#fff,#f0f0f0);"></div>
          <div class="seat-card" style="background:linear-gradient(135deg,#fff,#f0f0f0);"></div>
        </div>
      </div>

      <div class="seat s2">
        <div class="avatar">س</div>
        <div class="seat-name">سلطان</div>
        <div class="seat-balance">5,000</div>
        <div class="seat-bet"><div class="chip">40</div></div>
      </div>

      <div class="seat s3">
        <div class="avatar">ف</div>
        <div class="seat-name">فهد</div>
        <div class="seat-balance">5,000</div>
      </div>

      <div class="seat s4">
        <div class="avatar">ن</div>
        <div class="seat-name">نورة</div>
        <div class="seat-balance">5,000</div>
      </div>

      <div class="seat s5">
        <div class="avatar">ع</div>
        <div class="seat-name">عبدالله</div>
        <div class="seat-balance">5,000</div>
      </div>

      <div class="seat s6">
        <div class="avatar">م</div>
        <div class="seat-name">محمد</div>
        <div class="seat-balance">5,000</div>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn btn-fold">Fold</button>
      <button class="btn btn-call">Call 40</button>
      <button class="btn btn-raise">Raise</button>
    </div>
  </div>
</body>
</html>
