<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>جرب حظك — أيقونة التطبيق</title>
<style>html,body{margin:0;padding:0;background:#070A0F;}svg{display:block;}</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202F"/>
      <stop offset="0.55" stop-color="#0C121C"/>
      <stop offset="1" stop-color="#070A0F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#C9A961" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#C9A961" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#C9A961" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EED9A4"/>
      <stop offset="0.5" stop-color="#C9A961"/>
      <stop offset="1" stop-color="#8C6D2F"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2638"/>
      <stop offset="1" stop-color="#0E1520"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF2"/>
      <stop offset="1" stop-color="#E6DEC8"/>
    </linearGradient>
    <radialGradient id="chipGold" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#F2DCA4"/>
      <stop offset="0.7" stop-color="#C9A961"/>
      <stop offset="1" stop-color="#8A6A2C"/>
    </radialGradient>
    <radialGradient id="chipRed" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#C65B5B"/>
      <stop offset="0.7" stop-color="#8E2A2A"/>
      <stop offset="1" stop-color="#5C1414"/>
    </radialGradient>
    <radialGradient id="chipGreen" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#3FA97E"/>
      <stop offset="0.7" stop-color="#1F6E4B"/>
      <stop offset="1" stop-color="#0F3A27"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- الخلفية -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <rect width="1024" height="1024" fill="url(#vignette)"/>

  <!-- حلقات ذهبية -->
  <circle cx="512" cy="512" r="470" fill="none" stroke="url(#gold)" stroke-width="13" opacity="0.92"/>
  <circle cx="512" cy="512" r="444" fill="none" stroke="#C9A961" stroke-width="3" opacity="0.30"/>
  <circle cx="512" cy="512" r="452" fill="none" stroke="#EED9A4" stroke-width="1" opacity="0.25"/>

  <!-- ظل خلف المكوّنات -->
  <ellipse cx="512" cy="700" rx="270" ry="46" fill="#000000" opacity="0.38" filter="url(#soft)"/>

  <!-- مروحة أوراق خلفية -->
  <g opacity="0.92">
    <g transform="rotate(-17 512 640)">
      <rect x="332" y="430" width="270" height="390" rx="22" fill="url(#card)" stroke="#C9A961" stroke-opacity="0.55" stroke-width="3"/>
      <text x="352" y="500" font-family="Georgia, serif" font-size="64" fill="url(#gold)">♠</text>
      <text x="432" y="655" font-family="Georgia, serif" font-size="120" fill="url(#gold)" opacity="0.85">♠</text>
    </g>
    <g transform="rotate(0 512 640)">
      <rect x="377" y="422" width="270" height="390" rx="22" fill="url(#card)" stroke="#C9A961" stroke-opacity="0.7" stroke-width="3"/>
      <text x="397" y="492" font-family="Georgia, serif" font-size="64" fill="url(#gold)">♥</text>
      <text x="457" y="655" font-family="Georgia, serif" font-size="120" fill="url(#gold)" opacity="0.9">♥</text>
    </g>
    <g transform="rotate(17 512 640)">
      <rect x="422" y="430" width="270" height="390" rx="22" fill="url(#card)" stroke="#C9A961" stroke-opacity="0.55" stroke-width="3"/>
      <text x="442" y="500" font-family="Georgia, serif" font-size="64" fill="url(#gold)">♣</text>
      <text x="507" y="655" font-family="Georgia, serif" font-size="120" fill="url(#gold)" opacity="0.85">♣</text>
    </g>
  </g>

  <!-- فيشات الكازينو -->
  <g>
    <ellipse cx="512" cy="780" rx="196" ry="64" fill="url(#chipGreen)"/>
    <ellipse cx="512" cy="780" rx="196" ry="64" fill="none" stroke="#F7F3E8" stroke-width="7" stroke-dasharray="15 17" opacity="0.85"/>
    <ellipse cx="512" cy="780" rx="148" ry="46" fill="none" stroke="#F7F3E8" stroke-width="4" opacity="0.5"/>

    <ellipse cx="512" cy="740" rx="200" ry="66" fill="url(#chipRed)"/>
    <ellipse cx="512" cy="740" rx="200" ry="66" fill="none" stroke="#F7F3E8" stroke-width="7" stroke-dasharray="15 17" opacity="0.85"/>
    <ellipse cx="512" cy="740" rx="150" ry="47" fill="none" stroke="#F7F3E8" stroke-width="4" opacity="0.5"/>

    <ellipse cx="512" cy="700" rx="204" ry="68" fill="url(#chipGold)"/>
    <ellipse cx="512" cy="700" rx="204" ry="68" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-dasharray="15 17" opacity="0.9"/>
    <ellipse cx="512" cy="700" rx="154" ry="48" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.55"/>
    <ellipse cx="512" cy="700" rx="86" ry="26" fill="none" stroke="#6B5120" stroke-width="4" opacity="0.55"/>
  </g>

  <!-- النرد -->
  <g>
    <g transform="rotate(-13 452 500)">
      <rect x="380" y="380" width="180" height="180" rx="36" fill="url(#ivory)" stroke="#CBBF9E" stroke-width="4"/>
      <!-- 6: عمودان × 3 صفوف -->
      <circle cx="425" cy="425" r="15" fill="#2A1E10"/>
      <circle cx="425" cy="500" r="15" fill="#2A1E10"/>
      <circle cx="425" cy="575" r="15" fill="#2A1E10"/>
      <circle cx="515" cy="425" r="15" fill="#2A1E10"/>
      <circle cx="515" cy="500" r="15" fill="#2A1E10"/>
      <circle cx="515" cy="575" r="15" fill="#2A1E10"/>
    </g>
    <g transform="rotate(9 590 555)">
      <rect x="490" y="440" width="196" height="196" rx="39" fill="url(#ivory)" stroke="#CBBF9E" stroke-width="4"/>
      <!-- 5: أربع زوايا + مركز -->
      <circle cx="543" cy="493" r="16" fill="#2A1E10"/>
      <circle cx="633" cy="493" r="16" fill="#2A1E10"/>
      <circle cx="588" cy="538" r="16" fill="#2A1E10"/>
      <circle cx="543" cy="583" r="16" fill="#2A1E10"/>
      <circle cx="633" cy="583" r="16" fill="#2A1E10"/>
    </g>
  </g>

  <!-- بريق ذهبي -->
  <g fill="#EED9A4">
    <path d="M286 250 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 z" opacity="0.9"/>
    <path d="M752 736 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 z" opacity="0.8"/>
    <path d="M774 268 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" opacity="0.6"/>
    <circle cx="252" cy="768" r="7" opacity="0.5"/>
    <circle cx="778" cy="508" r="5" opacity="0.5"/>
  </g>
</svg>
</body>
</html>
